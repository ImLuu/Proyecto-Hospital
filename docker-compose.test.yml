# Entorno de TESTING (efímero)
# Uso:  docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#       docker compose -f docker-compose.test.yml down
# No necesita .env: usa sus propias variables y la BD vive en RAM (tmpfs).
name: hospital-test

x-db-env: &db-env
  DB_HOST: db                            # DNS interno: el servicio "db"
  DB_PORT: "5432"
  DB_NAME: hospital_test
  DB_USER: test_user
  DB_PASSWORD: test_password

services:
  app:
    build: .                             # Código copiado en la imagen, sin volumen
    environment:
      <<: *db-env
      APP_ENV: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health.php"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data         # BD en RAM: se borra al apagar
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d hospital_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    # Sin "ports": nada se expone a tu PC, solo la red interna de Docker

  tests:
    build: .
    environment:
      <<: *db-env
      APP_URL: http://app                # DNS interno: el servicio "app"
    volumes:
      - ./tests:/tests:ro
    command: ["php", "/tests/smoke_test.php"]
    depends_on:
      app:
        condition: service_healthy
